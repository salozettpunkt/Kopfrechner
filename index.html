table {

}

}

button {

  padding: 6px 10px;
  margin-right: 10px;
  font-size: 14px;
}

/* Responsive: kleine Bildschirme */
@media screen and (max-width: 500px) {
  th, td { padding: 3px 4px; min-width: 40px; }
  input[type="number"] { max-width: 40px; padding: 1px; font-size: 12px; }
  th input { max-width: 60px; font-size: 12px; }
}
</style>
