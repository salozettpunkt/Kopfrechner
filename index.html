.table-container {

  -webkit-overflow-scrolling: touch;
  margin-top: 10px;
}

/* Tabelle selbst */
table {
  border-collapse: collapse;

}

/* Zellen */
th, td {
  border: 1px solid #ccc;

}

input[type="number"] {

  max-width: 60px;

}

th input {

}

.total {
  font-weight: bold;
  background-color: #f5f5f5;
}

.winner {
  background-color: #b6f2b6 !important;
}

button {
  margin-top: 10px;
  padding: 6px 10px;
  margin-right: 10px;
  font-size: 14px;
}

/* Kleine Bildschirme */
@media screen and (max-width: 500px) {
  th, td { padding: 4px 6px; min-width: 50px; }
  input[type="number"] { max-width: 50px; font-size: 12px; }
  th input { max-width: 70px; font-size: 12px; }
}
</style>

<script>
let players = [];
let roundCount = 0;

function addPlayer(name = `Spieler ${players.length + 1}`) {
  players.push({ name });

  // Header
  const th = document.createElement("th");
  th.innerHTML = `<input value="${name}" oninput="renamePlayer(${players.length-1}, this.value)">`;
  document.getElementById("headerRow").appendChild(th);

  // Total
  const td = document.createElement("td");
  td.id = `total-${players.length-1}`;
  td.innerText = "0";
  document.getElementById("totalRow").appendChild(td);

  // Bestehende Runden aktualisieren
  document.querySelectorAll("#rounds tr").forEach(row => {
    const cell = document.createElement("td");
    cell.innerHTML = `<input type="number" value="0" oninput="updateTotals()">`;
    row.appendChild(cell);
  });
}

function renamePlayer(index, name) {
  players[index].name = name;
}

function addRound() {
  roundCount++;

    tr.appendChild(td);
  });
  document.getElementById("rounds").appendChild(tr);
}
